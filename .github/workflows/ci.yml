name: 테스트

# 분석 워크플로우는 스케줄로만 돌기 때문에, 그것만으로는 PR 시점에
# 점수 로직이 깨졌는지 알 수 없다. 변경이 들어올 때 바로 검증한다.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 구문 검사
        run: python -m compileall -q analyzer.py test_scoring.py summary_stat.py

      - name: 점수 함수 회귀 테스트
        run: python test_scoring.py

      - name: 요약값 조회 스크립트 동작 확인
        # 데이터 회귀 가드가 의존하므로, 파일이 없을 때 기본값을 내는지 확인한다
        run: |
          VAL=$(python summary_stat.py graded_count 0)
          echo "graded_count=${VAL}"
          case "${VAL}" in
            ''|*[!0-9]*) echo "::error::summary_stat.py 가 숫자를 반환하지 않았습니다: ${VAL}"; exit 1 ;;
          esac
          mkdir -p /tmp/empty && cd /tmp/empty
          MISSING=$(python "${GITHUB_WORKSPACE}/summary_stat.py" graded_count 0)
          test "${MISSING}" = "0" || { echo "::error::파일 부재 시 기본값 실패: ${MISSING}"; exit 1; }
          echo "파일 부재 시 기본값 정상"
