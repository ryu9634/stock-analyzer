name: 기업 분석 & 대시보드 배포

on:
  schedule:
    # 재무 데이터는 분기 실적 때만 바뀌므로 하루 1회로 충분하다.
    # 한국시간 평일 아침 7시 43분 = UTC 전날 22시 43분
    # (정시는 GitHub 크론이 혼잡해 지연되므로 일부러 비켜 둔다)
    - cron: '43 22 * * 0-4'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  analyze:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 재무 데이터 캐시 복원
        # 저장소에 커밋하지 않고 Actions 캐시로만 유지한다.
        # 따뜻한 캐시로 시작하면 API 호출이 줄어 레이트리밋을 피할 수 있다.
        uses: actions/cache@v4
        with:
          path: data/.fundamentals_cache.json
          key: fundamentals-${{ github.run_id }}
          restore-keys: |
            fundamentals-

      - name: 점수 함수 회귀 테스트
        # 잘못된 점수가 대시보드로 배포되기 전에 여기서 막는다
        run: python test_scoring.py

      - name: 직전 결과 규모 기록
        id: before
        run: |
          PREV=$(python summary_stat.py graded_count 0)
          echo "prev_graded=${PREV}" >> "$GITHUB_OUTPUT"
          echo "직전 등급부여 기업 수: ${PREV}"

      - name: 기업 분석 실행
        run: python analyzer.py
        timeout-minutes: 30

      - name: 데이터 회귀 가드
        # 레이트리밋 등으로 수집이 실패한 빈약한 결과가
        # 멀쩡한 직전 데이터를 덮어쓰는 것을 막는다.
        run: |
          PREV='${{ steps.before.outputs.prev_graded }}'
          CURR=$(python summary_stat.py graded_count 0)
          echo "등급부여 기업: ${PREV} -> ${CURR}"
          if [ "${PREV}" -gt 0 ] && [ "${CURR}" -lt $(( PREV * 60 / 100 )) ]; then
            echo "::error::등급부여 기업이 ${PREV}에서 ${CURR}로 40% 넘게 줄었습니다. API 수집 실패 가능성이 높아 발행을 중단합니다."
            git checkout -- data/analysis.js
            exit 1
          fi

      - name: 분석 결과 커밋
        run: |
          git config user.name "Quality Screener Bot"
          git config user.email "bot@quality-screener.local"
          git add data/analysis.js
          if git diff --staged --quiet; then
            echo "변경 사항 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "분석 업데이트 $(date -u +'%Y-%m-%d %H:%M UTC')"
          # 네트워크/경쟁 푸시 실패에 대비한 재시도
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "푸시 성공 (시도 ${attempt})"
              exit 0
            fi
            echo "푸시 실패 — 리베이스 후 재시도 (${attempt}/5)"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            sleep $(( 2 ** attempt ))
          done
          echo "::error::5회 시도 후에도 푸시 실패"
          exit 1

      - name: 배포 파일 수집
        # Pages 에는 대시보드가 실제로 쓰는 파일만 올린다.
        # 저장소 전체를 올리면 분석 스크립트와 캐시까지 공개 배포된다.
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/analysis.js _site/data/
          echo "배포 용량: $(du -sh _site | cut -f1)"

      - name: Pages 설정
        uses: actions/configure-pages@v4

      - name: 아티팩트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
